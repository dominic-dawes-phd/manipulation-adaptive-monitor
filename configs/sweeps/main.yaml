# Main sweep. Resize counts in docs/DOE.md section 5 after the pilot.
name: main
tasks: [transfer_cube, insertion]
cells:
  - {perturbation: none, split: train, episodes: 500, tasks: [transfer_cube]}
  - {perturbation: none, split: calib, episodes: 300, tasks: [transfer_cube]}
  - {perturbation: none, split: calib, episodes: 750, tasks: [insertion]}
  - {perturbation: none, split: test, episodes: 300}
  - {perturbation: knock, split: test, episodes: 200}
  - {perturbation: slip, split: test, episodes: 200, tasks: [transfer_cube]}
  - {perturbation: nudge, split: test, episodes: 200, tasks: [transfer_cube]}
  - {perturbation: peg_misalign, split: test, episodes: 200, tasks: [insertion]}
monitors: [vlm, wm]
stages: [rollout, train_wm, score_wm, score_vlm, evaluate, plot]
